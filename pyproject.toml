[project]
name = "ontime"
version = "0.1.0"
description = "Explainable late-delivery risk engine for e-commerce (Olist)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "interpret>=0.6",
    "optuna>=3.6",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "shap>=0.45",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "streamlit>=1.35",
    "holidays>=0.50",
    "kaggle>=1.6",
    "PyYAML>=6.0",
    "joblib>=1.4",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "nbconvert>=7",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontime"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# Notebooks hold narrative prose and imports-after-setup by design.
"notebooks/*.ipynb" = ["E501", "E402", "E702", "E731", "F401", "I001"]
"src/ontime/analysis/*.py" = ["E402"]
"src/ontime/data/build_orders.py" = ["E402"]

"src/ontime/evaluation/report.py" = ["E501"]
"src/ontime/evaluation/run.py" = ["E501"]
